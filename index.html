<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車輛維修報價系統</title>
  <style>
    :root {
      /* 低飽和黃銅橘 + 暗黑金屬色調 */
      --bg-dark: #0f0e0d;
      --card-bg: rgba(24, 22, 20, 0.92);
      --brass-primary: #c88a38;   /* 低飽和黃銅橘 */
      --brass-light: #e0b168;     /* 淺黃銅色 */
      --brass-dark: #7a511e;      /* 深黃銅色 */
      --brass-border: rgba(200, 138, 56, 0.35);
      --text-main: #e6e4e0;
      --text-muted: #9e9a93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(200, 138, 56, 0.08), transparent 60%),
        linear-gradient(to bottom, #0a0908, #141311);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      padding: 20px;
      padding-bottom: 140px; /* 增加底部留白以適應放大的結算列 */
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      color: var(--brass-light);
      text-align: center;
      margin-bottom: 25px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(200, 138, 56, 0.2);
    }

    /* 分頁標籤 */
    .tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(30, 28, 25, 0.8);
      border: 1px solid var(--brass-border);
      color: var(--brass-light);
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.25s ease;
      font-size: 1rem;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--brass-primary);
      color: #0f0e0d;
      box-shadow: 0 0 12px rgba(200, 138, 56, 0.35);
    }

    /* 類別備註標示 */
    .category-note {
      text-align: center;
      color: var(--brass-primary);
      font-size: 0.9rem;
      margin-bottom: 20px;
      padding: 8px;
      background: rgba(200, 138, 56, 0.1);
      border-radius: 4px;
      border: 1px dashed var(--brass-border);
    }

    /* 內容區域 */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    /* 零件卡片 */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--brass-border);
      border-radius: 8px;
      padding: 16px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      border-color: var(--brass-primary);
      box-shadow: 0 0 12px rgba(200, 138, 56, 0.25);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title {
      color: var(--brass-light);
      font-size: 1.1rem;
      font-weight: bold;
    }

    .card-price {
      color: var(--brass-primary);
      font-weight: bold;
      font-size: 1rem;
    }

    /* 加減數量計數器 */
    .counter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 9, 8, 0.6);
      border: 1px solid var(--brass-border);
      border-radius: 4px;
      padding: 4px;
      margin-bottom: 10px;
    }

    .counter button {
      background: rgba(200, 138, 56, 0.15);
      border: 1px solid var(--brass-border);
      color: var(--brass-light);
      width: 34px;
      height: 32px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: background 0.2s;
    }

    .counter button:hover {
      background: var(--brass-primary);
      color: #0f0e0d;
    }

    .counter span {
      font-weight: bold;
      color: #ffffff;
      font-size: 1.05rem;
    }

    /* 卡片內小計區塊 */
    .card-subtotal {
      background: rgba(200, 138, 56, 0.08);
      border: 1px solid rgba(200, 138, 56, 0.25);
      border-radius: 5px;
      padding: 8px 10px;
      font-size: 0.85rem;
      line-height: 1.4;
      display: none;
    }

    .card-subtotal.active {
      display: block;
    }

    .subtotal-price {
      color: var(--brass-light);
      font-weight: bold;
    }

    /* 底部懸浮結算列 (特大面板) */
    .summary-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(12, 11, 10, 0.97);
      border-top: 3px solid var(--brass-primary);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.95);
      padding: 22px 28px;
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .summary-container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    /* 總金額特大字體 + 橘褐色 */
    .total-price {
      font-size: 1.5rem;
      color: var(--brass-light);
      font-weight: bold;
      letter-spacing: 0.5px;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
    }

    .total-price span.price-num {
      color: #e09238; /* 橘褐色 */
      font-size: 2.6rem;
      font-weight: 800;
      margin-left: 8px;
      text-shadow: 0 0 12px rgba(224, 146, 56, 0.35);
    }

    .fee-note {
      font-size: 0.9rem;
      color: var(--brass-primary);
      margin-left: 10px;
      font-weight: normal;
    }

    /* 按鈕組 */
    .action-btns {
      display: flex;
      gap: 10px;
    }

    .copy-btn {
      background: var(--brass-primary);
      border: 1px solid var(--brass-light);
      color: #0f0e0d;
      padding: 12px 22px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: all 0.25s;
      box-shadow: 0 0 10px rgba(200, 138, 56, 0.2);
    }

    .copy-btn:hover {
      background: var(--brass-light);
      box-shadow: 0 0 15px rgba(200, 138, 56, 0.5);
    }

    .reset-btn {
      background: rgba(200, 138, 56, 0.08);
      border: 1px solid var(--brass-primary);
      color: var(--brass-light);
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: all 0.25s;
    }

    .reset-btn:hover {
      background: rgba(200, 138, 56, 0.25);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>車輛維修報價系統</h1>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('exterior-repair', this)">外觀維修</button>
      <button class="tab-btn" onclick="switchTab('core-repair', this)">核心零件維修</button>
    </div>

    <div id="note-exterior-repair" class="category-note">⚠️ 外觀維修分類選購時，總合將自動加上 $500 施工工本費</div>
    <div id="note-core-repair" class="category-note" style="display:none;">📌 核心零件維修分類（無額外工本費）</div>

    <div id="exterior-repair" class="tab-content active"></div>
    <div id="core-repair" class="tab-content"></div>
  </div>

  <div class="summary-bar">
    <div class="summary-container">
      <div class="total-price">
        預估總金額：$<span id="total-cost" class="price-num">0</span>
        <span id="labor-fee-tag" class="fee-note" style="display:none;">(含外觀維修工本費 $500)</span>
      </div>
      <div class="action-btns">
        <button class="copy-btn" onclick="copyList()">📋 複製清單</button>
        <button class="reset-btn" onclick="resetAll()">清空選擇</button>
      </div>
    </div>
  </div>

  <script>
    // 精簡後的兩大分類與指定品項資料
    const itemsData = [
      // 1. 外觀維修 (含 500 工本費邏輯)
      { id: 'ext_hood', category: 'exterior-repair', name: '引擎蓋', price: 700 },
      { id: 'ext_trunk', category: 'exterior-repair', name: '後車箱', price: 500 },
      { id: 'ext_window', category: 'exterior-repair', name: '車窗', price: 150 },
      { id: 'ext_tire', category: 'exterior-repair', name: '車輪胎', price: 500 },
      { id: 'ext_door', category: 'exterior-repair', name: '車門', price: 350 },

      // 2. 核心零件維修
      { id: 'core_steering', category: 'core-repair', name: '動力方向盤幫浦', price: 1000 },
      { id: 'core_injector', category: 'core-repair', name: '噴油嘴', price: 1000 },
      { id: 'core_radiator', category: 'core-repair', name: '水箱', price: 650 },
      { id: 'core_brake', category: 'core-repair', name: '煞車系統', price: 600 },
      { id: 'core_generator', category: 'core-repair', name: '發電機', price: 1000 },
      { id: 'core_gearbox', category: 'core-repair', name: '變速箱', price: 1800 }
    ];

    const itemCounts = {};

    function renderItems() {
      itemsData.forEach(item => {
        itemCounts[item.id] = 0;
        const container = document.getElementById(item.category);
        if (!container) return;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div>
            <div class="card-header">
              <span class="card-title">${item.name}</span>
              <span class="card-price">$${item.price.toLocaleString()}</span>
            </div>
          </div>
          
          <div>
            <div class="counter">
              <button onclick="updateCount('${item.id}', -1)">-</button>
              <span id="count-${item.id}">0</span>
              <button onclick="updateCount('${item.id}', 1)">+</button>
            </div>

            <div id="subtotal-${item.id}" class="card-subtotal">
              <div class="subtotal-price" id="subtotal-price-${item.id}">小計：$0</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function switchTab(tabId, btnElem) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.querySelectorAll('.category-note').forEach(note => note.style.display = 'none');

      btnElem.classList.add('active');
      document.getElementById(tabId).classList.add('active');

      const activeNote = document.getElementById(`note-${tabId}`);
      if (activeNote) activeNote.style.display = 'block';
    }

    function updateCount(id, change) {
      if (itemCounts[id] + change < 0) return;
      itemCounts[id] += change;
      document.getElementById(`count-${id}`).innerText = itemCounts[id];

      updateCardSubtotal(id);
      calculateSummary();
    }

    function updateCardSubtotal(id) {
      const count = itemCounts[id];
      const item = itemsData.find(i => i.id === id);
      const subtotalElem = document.getElementById(`subtotal-${id}`);

      if (count > 0) {
        subtotalElem.classList.add('active');
        const priceElem = document.getElementById(`subtotal-price-${id}`);
        priceElem.innerText = `金額小計：$${(count * item.price).toLocaleString()}`;
      } else {
        subtotalElem.classList.remove('active');
      }
    }

    function calculateSummary() {
      let totalCost = 0;
      let hasExteriorRepair = false;

      itemsData.forEach(item => {
        const count = itemCounts[item.id] || 0;
        if (count > 0) {
          totalCost += count * item.price;
          if (item.category === 'exterior-repair') {
            hasExteriorRepair = true;
          }
        }
      });

      if (hasExteriorRepair) {
        totalCost += 500;
        document.getElementById('labor-fee-tag').style.display = 'inline';
      } else {
        document.getElementById('labor-fee-tag').style.display = 'none';
      }

      document.getElementById('total-cost').innerText = totalCost.toLocaleString();
    }

    function copyList() {
      let selectedItems = [];
      let totalCost = 0;
      let hasExteriorRepair = false;

      itemsData.forEach(item => {
        const count = itemCounts[item.id] || 0;
        if (count > 0) {
          const itemCost = count * item.price;
          totalCost += itemCost;
          if (item.category === 'exterior-repair') hasExteriorRepair = true;
          selectedItems.push(`• ${item.name} x${count} ($${itemCost.toLocaleString()})`);
        }
      });

      if (selectedItems.length === 0) {
        alert('目前尚未選擇任何品項喔！');
        return;
      }

      let text = "🛠️ 【車輛維修報價明細】\n";
      text += "-------------------------\n";
      text += "📦 選購品項：\n" + selectedItems.join("\n") + "\n\n";

      if (hasExteriorRepair) {
        totalCost += 500;
        text += "🔧 外觀維修工本費： $500\n";
      }

      text += `💰 預估總金額： $${totalCost.toLocaleString()}\n`;
      text += "-------------------------";

      navigator.clipboard.writeText(text).then(() => {
        alert('已成功複製試算清單到剪貼簿！');
      }).catch(err => {
        alert('複製失敗，請手動複製。');
      });
    }

    function resetAll() {
      Object.keys(itemCounts).forEach(id => {
        itemCounts[id] = 0;
        const countElem = document.getElementById(`count-${id}`);
        if (countElem) countElem.innerText = '0';
        updateCardSubtotal(id);
      });
      calculateSummary();
    }

    // 初始化渲染
    renderItems();
  </script>
</body>
</html>
